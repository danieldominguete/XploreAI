[project]
name = "xploreai"
version = "0.2.0"
description = "Library and cookbook codes for AI Engineering Projects"
readme = "README.md"
authors = [
    { name = "Daniel Dominguete", email = "daniel.dominguete@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.1.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
xploreai = "xploreai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "ipykernel>=7.4.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
